name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify SLP consistency
        run: python3 scripts/slp.py verify
      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run Node policy & guard tests
        run: node --test tests/test_*.mjs
